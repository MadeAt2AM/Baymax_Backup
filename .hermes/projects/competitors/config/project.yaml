# Project configuration for the competitors intelligence pipeline.
#
# The `niche` field is the single source of truth for what the operator
# makes content about. It is loaded by the analysis playbook and the
# validator. It must be a complete sentence: "I make content about X for Y."

niche: "YOUR NICHE — replace this with the actual sentence in the shape I make content about X for Y."

# Run defaults. The pipeline can override these on the command line.
run:
  default_limit_per_account: 3
  default_cap_per_run: 50
  default_max_bytes: 104857600      # 100 MiB
  default_max_duration_seconds: 180

# OpenCLI on the dev VPS. The credential is a persistent site-session
# directory that lives outside the repository.
opencli:
  binary: /usr/local/bin/opencli
  site_session: persistent
  window: background

# Local Faster-Whisper on the dev VPS. The model is pinned to a known
# revision after the dev-VPS capacity benchmark.
whisper:
  model: tiny         # post-benchmark upgrade to base/small is plausible
  model_revision: null
  device: cpu
  compute_type: int8
  workers: 1

# Time handling. All displayed timestamps are in SGT (UTC+8).
timezone: Asia/Singapore
