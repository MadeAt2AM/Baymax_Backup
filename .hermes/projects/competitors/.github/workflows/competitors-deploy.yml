name: Deploy competitors dev

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'pipeline/**'
      - 'deploy/**'
      - 'pyproject.toml'
      - 'poetry.lock'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dev VPS deploy
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"repository": "${{ github.repository }}", "sha": "${{ github.sha }}"}' \
            https://competitors.terrybot.top/.webhook/deploy
