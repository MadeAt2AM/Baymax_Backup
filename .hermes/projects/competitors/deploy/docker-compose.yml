name: competitors

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - competitors-net

  api:
    image: competitors-api:0.1.0
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH}
      CORS_ORIGIN: ${CORS_ORIGIN}
      OPENCLI_BIN: ${OPENCLI_BIN:-/usr/bin/opencli}
      APPROVED_INSTAGRAM_ACCOUNT: ${APPROVED_INSTAGRAM_ACCOUNT}
      OPENCLI_PROFILE_DIR: ${OPENCLI_PROFILE_DIR}
    volumes:
      - opencli-profile:/srv/competitors-private/opencli-profile
      - audio:/srv/competitors-private/audio:ro
      - bundles:/srv/competitors-private/bundles
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - competitors-net

  web:
    image: competitors-web:0.1.0
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - competitors-net

  whisper-worker:
    image: competitors-api:0.1.0
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    profiles: ["transcription"]
    command: ["python", "-m", "pipeline.transcribe_watcher"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENCLI_BIN: ${OPENCLI_BIN:-/usr/bin/opencli}
      APPROVED_INSTAGRAM_ACCOUNT: ${APPROVED_INSTAGRAM_ACCOUNT}
      OPENCLI_PROFILE_DIR: ${OPENCLI_PROFILE_DIR}
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-en}
    volumes:
      - opencli-profile:/srv/competitors-private/opencli-profile
      - audio:/srv/competitors-private/audio
      - bundles:/srv/competitors-private/bundles
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - competitors-net

volumes:
  postgres-data:
  opencli-profile:
  audio:
  bundles:

networks:
  competitors-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
