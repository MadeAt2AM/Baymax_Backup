[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "competitors"
version = "0.1.0"
description = "Self-hosted competitor-intelligence pipeline for the CyberSlide/MadeAt2AM dashboard."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
competitors-collect = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests"]
addopts = "-q"
asyncio_mode = "auto"
