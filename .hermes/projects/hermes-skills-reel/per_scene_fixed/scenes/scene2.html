<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0f; font-family: 'Space Grotesk', sans-serif; }
body::before { content: ''; position: fixed; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
.glow-orb { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
.clip { position: fixed; inset: 0; pointer-events: none; }
.scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 60px; box-sizing: border-box; }
.bold-num { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; }
.mono { font-family: 'JetBrains Mono', monospace; }
.card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; backdrop-filter: blur(10px); }
.card-orange { border-color: rgba(255,107,53,0.3); box-shadow: 0 0 30px rgba(255,107,53,0.15); }
.skill-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; background: rgba(255,107,53,0.12); border: 1px solid rgba(255,107,53,0.3); border-radius: 100px; font-size: 18px; font-weight: 600; color: #FF6B35; letter-spacing: 0.5px; }
.scene-title { font-size: 96px; font-weight: 800; line-height: 1.0; letter-spacing: -3px; color: #fff; text-align: center; }
.scene-title .accent { color: #FF6B35; }
.body-text { font-size: 38px; font-weight: 500; color: rgba(255,255,255,0.7); text-align: center; line-height: 1.4; max-width: 900px; }
.sub-text { font-size: 28px; font-weight: 400; color: rgba(255,255,255,0.45); text-align: center; letter-spacing: 1px; }
.cta-text { font-size: 110px; font-weight: 800; color: #fff; text-align: center; letter-spacing: -2px; }
.cta-accent { color: #FF6B35; }
.hl { color: #FF6B35; font-weight: 700; }
.skill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; }
.sg-item { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 14px; }
.sg-icon { width: 48px; height: 48px; border-radius: 12px; background: rgba(255,107,53,0.15); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.sg-label { font-size: 22px; font-weight: 600; color: #fff; }
.mkt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
.mkt-item { background: rgba(255,107,53,0.08); border: 1px solid rgba(255,107,53,0.2); border-radius: 14px; padding: 18px 22px; text-align: center; }
.mkt-label { font-size: 24px; font-weight: 700; color: #FF6B35; display: block; }
.mkt-sub { font-size: 16px; color: rgba(255,255,255,0.5); display: block; margin-top: 4px; }
.asset-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
.asset-thumb { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
.jtbd-board { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 28px; width: 100%; }
.jtbd-row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.jtbd-problem { flex: 1; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); border-radius: 12px; padding: 14px 18px; font-size: 22px; font-weight: 500; color: #f87171; text-align: center; }
.jtbd-arrow { font-size: 28px; color: rgba(255,255,255,0.3); }
.jtbd-solution { flex: 1; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); border-radius: 12px; padding: 14px 18px; font-size: 22px; font-weight: 500; color: #4ade80; text-align: center; }
.split-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; height: 400px; }
.split-before, .split-after { border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.split-before { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 20px; }
.split-after { background: rgba(255,107,53,0.08); border: 1px solid rgba(255,107,53,0.25); padding: 20px; box-shadow: 0 0 40px rgba(255,107,53,0.1); }
.split-label { font-size: 18px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
.split-before .split-label { color: rgba(255,255,255,0.4); }
.split-after .split-label { color: #FF6B35; }
.final-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
.final-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; text-align: center; }
.final-card-icon { font-size: 40px; margin-bottom: 8px; }
.final-card-name { font-size: 20px; font-weight: 700; color: #fff; }
.particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.particle { position: absolute; width: 4px; height: 4px; background: #FF6B35; border-radius: 50%; opacity: 0.4; }
#tr-flash { position: fixed; inset: 0; background: #fff; pointer-events: none; z-index: 990; opacity: 0; }

  </style>
</head>
<body data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="4">
  <div id="tr-flash"></div>
  <div class="particles" id="particles"></div>
  <div class="glow-orb" style="width:600px;height:600px;background:rgba(255,107,53,0.08);top:-200px;right:-200px;"></div>
  <div class="glow-orb" style="width:400px;height:400px;background:rgba(255,107,53,0.06);bottom:200px;left:-100px;"></div>

  <div id="scene2" class="clip scene" data-start="0" data-duration="4" data-track-index="1">
<div style="font-size:32px;font-weight:600;color:rgba(255,255,255,0.4);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;" id="s2label">THE REALITY</div>
    <div id="s2title" style="font-size:64px;font-weight:800;color:#fff;text-align:center;line-height:1.1;letter-spacing:-1px;">Pakshe beginnersinu<br/><span style="color:#FF6B35;">athra easy alla.</span></div>
    <div id="s2sub" style="font-size:32px;font-weight:500;color:rgba(255,255,255,0.45);text-align:center;margin-top:12px;">Evidunn start cheyyanam?</div>
    <div id="s2cards" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;width:100%;"><div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">📝</div><div style="font-size:16px;font-weight:600;color:#fff;">Copy</div></div><div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">🎨</div><div style="font-size:16px;font-weight:600;color:#fff;">Design</div></div><div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">🔍</div><div style="font-size:16px;font-weight:600;color:#fff;">Research</div></div><div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">⚡</div><div style="font-size:16px;font-weight:600;color:#fff;">Power</div></div><div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">🌐</div><div style="font-size:16px;font-weight:600;color:#fff;">Web</div></div><div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">📊</div><div style="font-size:16px;font-weight:600;color:#fff;">Data</div></div><div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">🤖</div><div style="font-size:16px;font-weight:600;color:#fff;">AI</div></div><div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">📱</div><div style="font-size:16px;font-weight:600;color:#fff;">Mobile</div></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function() {
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    (function() {
      function mulberry32(seed) {
        return function() {
          seed |= 0; seed = seed + 0x6D2B79F5 | 0;
          var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }
      var rng = mulberry32(4);
      var container = document.getElementById('particles');
      for (var i = 0; i < 30; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = (rng() * 1080) + 'px';
        p.style.top = (rng() * 1920) + 'px';
        p.style.opacity = 0.1 + rng() * 0.4;
        var sz = 2 + rng() * 4;
        p.style.width = p.style.height = sz + 'px';
        container.appendChild(p);
      }
    })();


    tl.set('#scene2', { opacity: 1 }, 0);
    tl.from('#s2label', { y: -20, opacity: 0, duration: 0.4, ease: 'power2.out' }, 0.2);
    tl.from('#s2title', { y: 30, opacity: 0, duration: 0.6, ease: 'power3.out' }, 0.5);
    tl.from('#s2sub', { opacity: 0, duration: 0.4, ease: 'power2.out' }, 1.1);
    tl.from('#s2cards .card', { scale: 0.7, opacity: 0, stagger: { each: 0.06, from: 'random' }, duration: 0.4, ease: 'back.out(1.7)' }, 1.4);
    tl.to('#scene2', { opacity: 0, duration: 0.2 }, 3.8);

    window.__timelines['main'] = tl;
  })();
  </script>
</body>
</html>
