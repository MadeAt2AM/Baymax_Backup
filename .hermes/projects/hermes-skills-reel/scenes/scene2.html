<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0f; }
    body { background: #0a0a0f; }
    .clip { position: fixed; inset: 0; z-index: 1; }
    .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 60px; box-sizing: border-box; }
    /* Typography helpers */
    .bold-num { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; }
    .accent { color: #FF6B35; }
    .skill-pill { display: flex; align-items: center; gap: 8px; background: rgba(255,107,53,0.12); border: 1px solid rgba(255,107,53,0.3); border-radius: 100px; padding: 10px 20px; font-size: 18px; font-weight: 600; color: #FF6B35; letter-spacing: 1px; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; }
    .card-orange { background: rgba(255,107,53,0.12); border: 1px solid rgba(255,107,53,0.3); border-radius: 16px; }
    .body-text { font-size: 32px; font-weight: 400; color: rgba(255,255,255,0.75); text-align: center; }
    /* Dot grid background */
    body::before { content: ''; position: fixed; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0f; }
    ::-webkit-scrollbar-thumb { background: rgba(255,107,53,0.4); border-radius: 3px; }
  </style>
</head>
<body data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="4">
<div id="scene2" class="scene"
       >

    <div style="font-size:32px;font-weight:600;color:rgba(255,255,255,0.4);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;" id="s2label">THE REALITY</div>

    <div id="s2title" style="font-size:64px;font-weight:800;color:#fff;text-align:center;line-height:1.1;letter-spacing:-1px;">
      Pakshe beginnersinu<br/><span style="color:#FF6B35;">athra easy alla.</span>
    </div>

    <div id="s2sub" style="font-size:32px;font-weight:500;color:rgba(255,255,255,0.45);text-align:center;margin-top:12px;">
      Evidunn start cheyyanam?
    </div>

    <!-- Floating skill cards -->
    <div id="s2cards" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;width:100%;">
      <div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">📝</div><div style="font-size:16px;font-weight:600;color:#fff;">Copy</div></div>
      <div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">🎨</div><div style="font-size:16px;font-weight:600;color:#fff;">Design</div></div>
      <div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">🔍</div><div style="font-size:16px;font-weight:600;color:#fff;">Research</div></div>
      <div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">⚡</div><div style="font-size:16px;font-weight:600;color:#fff;">Power</div></div>
      <div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">🌐</div><div style="font-size:16px;font-weight:600;color:#fff;">Web</div></div>
      <div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">📊</div><div style="font-size:16px;font-weight:600;color:#fff;">Data</div></div>
      <div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">🤖</div><div style="font-size:16px;font-weight:600;color:#fff;">AI</div></div>
      <div class="card" style="padding:14px 12px;text-align:center;"><div style="font-size:28px;">📱</div><div style="font-size:16px;font-weight:600;color:#fff;">Mobile</div></div>
    </div>
  </div>
<script>
  window.__timelines = window.__timelines || {};
  gsap.set('.clip', { opacity: 1 });
  gsap.set('.scene', { opacity: 1 });
  var tl = gsap.timeline({ paused: false });
  tl.to({}, { duration: 4 });
  window.__timelines['main'] = tl;
</script>
</body>
</html>
