<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a0a0f; }
    body { background: #0a0a0f; }
    .clip { position: fixed; inset: 0; z-index: 1; }
    .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 60px; box-sizing: border-box; }
    /* Typography helpers */
    .bold-num { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-variant-numeric: tabular-nums; }
    .accent { color: #FF6B35; }
    .skill-pill { display: flex; align-items: center; gap: 8px; background: rgba(255,107,53,0.12); border: 1px solid rgba(255,107,53,0.3); border-radius: 100px; padding: 10px 20px; font-size: 18px; font-weight: 600; color: #FF6B35; letter-spacing: 1px; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; }
    .card-orange { background: rgba(255,107,53,0.12); border: 1px solid rgba(255,107,53,0.3); border-radius: 16px; }
    .body-text { font-size: 32px; font-weight: 400; color: rgba(255,255,255,0.75); text-align: center; }
    /* Dot grid background */
    body::before { content: ''; position: fixed; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0f; }
    ::-webkit-scrollbar-thumb { background: rgba(255,107,53,0.4); border-radius: 3px; }
  </style>
</head>
<body data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="8">
<div id="scene4" class="scene"
       >

    <div id="s4badge">
      <div class="skill-pill">SKILL #1</div>
    </div>

    <div id="s4title" style="font-size:80px;font-weight:800;color:#fff;text-align:center;letter-spacing:-2px;line-height:1.0;">
      <span class="accent">Marketing</span><br/>Skills
    </div>

    <div id="s4headline" style="font-size:36px;font-weight:600;color:rgba(255,255,255,0.8);text-align:center;">
      32 marketing skills in one place
    </div>

    <div id="s4grid" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;">
      <div class="mkt-item"><span class="mkt-label">Copywriting</span><span class="mkt-sub">headlines &amp; hooks</span></div>
      <div class="mkt-item"><span class="mkt-label">Ads</span><span class="mkt-sub">campaign dashboards</span></div>
      <div class="mkt-item"><span class="mkt-label">Landing Pages</span><span class="mkt-sub">high-converting layouts</span></div>
      <div class="mkt-item"><span class="mkt-label">Funnels</span><span class="mkt-sub">full funnel strategy</span></div>
    </div>

    <div id="s4stat" style="background:rgba(255,107,53,0.1);border:1px solid rgba(255,107,53,0.25);border-radius:16px;padding:20px 40px;text-align:center;">
      <div style="font-size:72px;font-weight:800;color:#FF6B35;font-variant-numeric:tabular-nums;">32</div>
      <div style="font-size:22px;font-weight:500;color:rgba(255,255,255,0.6);">skills ready to use</div>
    </div>
  </div>
<script>
  window.__timelines = window.__timelines || {};
  gsap.set('.clip', { opacity: 1 });
  gsap.set('.scene', { opacity: 1 });
  var tl = gsap.timeline({ paused: false });
  tl.to({}, { duration: 8 });
  window.__timelines['main'] = tl;
</script>
</body>
</html>
