# Systemd Memory Cap Drop-in
#
# Usage: copy to /etc/systemd/system/<service>.service.d/memory-cap.conf
# Adjust the limits below for your workload (see SKILL.md sizing table).
# After saving, run: systemctl daemon-reload
# Then restart the service for the cap to take effect:
#   systemctl restart <service>
#
# Verify: systemctl show <service> | grep -E "^Memory(High|Max)="

[Service]
# Soft limit — kernel reclaims cache and slows allocation if RSS approaches this
# Service continues running but performance may degrade
MemoryHigh=1500M

# Hard limit — service is OOM-killed if RSS reaches this
# Service's systemd Restart= policy will then restart it (clean state)
MemoryMax=2000M