<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: 'Inter'; font-weight: 900;
      src: url('https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.1/files/inter-latin-900-normal.woff2') format('woff2');
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FDFBF7; }
    body { font-family: 'Inter', 'Arial', sans-serif; color: #111111; }

    #blueprint {
      position: fixed; inset: 0; width: 1080px; height: 1920px; pointer-events: none; z-index: 1;
      background-image:
        linear-gradient(rgba(17,17,17,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(17,17,17,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    #glow-mesh {
      position: fixed; inset: 0; width: 1080px; height: 1920px; pointer-events: none; z-index: 0; overflow: hidden;
    }
    #glow-mesh::before {
      content: ''; position: absolute; width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(255,193,7,0.18) 0%, transparent 70%);
      top: -100px; right: -150px;
      animation: driftA 8s ease-in-out infinite alternate;
    }
    #glow-mesh::after {
      content: ''; position: absolute; width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(211,47,47,0.12) 0%, transparent 70%);
      bottom: 200px; left: -100px;
      animation: driftB 10s ease-in-out infinite alternate;
    }
    @keyframes driftA { from: transform: translate(0,0); to: transform: translate(-60px, 40px); }
    @keyframes driftB { from: transform: translate(0,0); to: transform: translate(50px, -30px); }

    .bracket { position: fixed; width: 48px; height: 48px; z-index: 200; pointer-events: none; }
    .bracket::before, .bracket::after { content: ''; position: absolute; background: #111111; }
    .bracket-tl { top: 28px; left: 28px; }
    .bracket-tl::before { width: 2px; height: 48px; top: 0; left: 0; }
    .bracket-tl::after  { width: 48px; height: 2px; top: 0; left: 0; }
    .bracket-tr { top: 28px; right: 28px; }
    .bracket-tr::before { width: 2px; height: 48px; top: 0; right: 0; }
    .bracket-tr::after  { width: 48px; height: 2px; top: 0; right: 0; }
    .bracket-bl { bottom: 28px; left: 28px; }
    .bracket-bl::before { width: 2px; height: 48px; bottom: 0; left: 0; }
    .bracket-bl::after  { width: 48px; height: 2px; bottom: 0; left: 0; }
    .bracket-br { bottom: 28px; right: 28px; }
    .bracket-br::before { width: 2px; height: 48px; bottom: 0; right: 0; }
    .bracket-br::after  { width: 48px; height: 2px; bottom: 0; right: 0; }

    #scene6 {
      position: fixed; top: 0; left: 0; width: 1080px; height: 1920px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding-top: 120px; padding-left: 64px; padding-right: 64px; box-sizing: border-box;
      z-index: 60; background: transparent; text-align: center; gap: 0;
    }
    .cta-brand {
      font-size: 24px; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase;
      color: #111111; margin-bottom: 80px;
      opacity: 0; y: -20;
    }
    .cta-brand .sparkle { color: #FFC107; }
    .cta-main {
      font-size: 56px; font-weight: 800; color: #111111; line-height: 1.15;
      max-width: 860px; margin-bottom: 60px;
      opacity: 0; y: 30;
    }
    .cta-btn {
      display: inline-flex; align-items: center; justify-content: center;
      background: #D32F2F; color: #FDFBF7;
      font-size: 52px; font-weight: 900; letter-spacing: 0.06em;
      padding: 28px 72px; border-radius: 60px; margin-bottom: 48px;
      position: relative; overflow: hidden; cursor: default;
      scale: 0.6; opacity: 0;
    }
    .cta-btn::before {
      content: ''; position: absolute; width: 200%; height: 100%;
      background: rgba(255,255,255,0.25); top: 0; left: -100%;
      transform: skewX(-20deg);
      animation: spotlight 2.5s ease-in-out infinite;
    }
    @keyframes spotlight {
      0%   { left: -100%; }
      60%  { left: -100%; }
      80%  { left: 60%; }
      100% { left: 120%; }
    }
    .cta-sub {
      font-size: 32px; font-weight: 500; color: #111111; opacity: 0; margin-top: 8px;
    }

    /* Exit animation wrapper — fade-out only */
    #scene6-content { width: 100%; }
  </style>
</head>
<body
  data-composition-id="main"
  data-width="1080"
  data-height="1920"
  data-start="0"
  data-duration="6"
>
  <div id="blueprint"></div>
  <div id="glow-mesh"></div>
  <div class="bracket bracket-tl"></div>
  <div class="bracket bracket-tr"></div>
  <div class="bracket bracket-bl"></div>
  <div class="bracket bracket-br"></div>

  <div id="scene6">
    <div id="scene6-content">
      <div class="cta-brand">
        <span class="sparkle">✨</span> MADEAT2AM <span class="sparkle">✨</span>
      </div>

      <div class="cta-main">
        Comment <span style="color:#FFC107;background:#111111;padding:0 10px;border-radius:6px">COUNCIL</span> and I'll send you the exact guide.
      </div>

      <div class="cta-btn">[ COUNCIL ]</div>

      <div class="cta-sub">See you in the next one.</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines['main'] = gsap.timeline({ paused: false });
    const tl = window.__timelines['main'];
    tl.to('.cta-brand', { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.1);
    tl.to('.cta-main',  { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 0.3);
    tl.to('.cta-btn',   { scale: 1, opacity: 1, duration: 0.7, ease: 'back.out(2.0)' }, 0.6);
    tl.to('.cta-sub',   { opacity: 0.55, duration: 0.8, ease: 'power2.out' }, 1.2);
    // Exit: fade out the content wrapper only
    tl.to('#scene6-content', { opacity: 0, duration: 1.0, ease: 'power2.in' }, 4.8);
  </script>
</body>
</html>
