<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: 'Inter'; font-weight: 900;
      src: url('https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.1/files/inter-latin-900-normal.woff2') format('woff2');
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FDFBF7; }
    body { font-family: 'Inter', 'Arial', sans-serif; color: #111111; }

    #blueprint {
      position: fixed; inset: 0; width: 1080px; height: 1920px; pointer-events: none; z-index: 1;
      background-image:
        linear-gradient(rgba(17,17,17,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(17,17,17,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    #glow-mesh {
      position: fixed; inset: 0; width: 1080px; height: 1920px; pointer-events: none; z-index: 0; overflow: hidden;
    }
    #glow-mesh::before {
      content: ''; position: absolute; width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(255,193,7,0.18) 0%, transparent 70%);
      top: -100px; right: -150px;
      animation: driftA 8s ease-in-out infinite alternate;
    }
    #glow-mesh::after {
      content: ''; position: absolute; width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(211,47,47,0.12) 0%, transparent 70%);
      bottom: 200px; left: -100px;
      animation: driftB 10s ease-in-out infinite alternate;
    }
    @keyframes driftA { from: transform: translate(0,0); to: transform: translate(-60px, 40px); }
    @keyframes driftB { from: transform: translate(0,0); to: transform: translate(50px, -30px); }

    .bracket { position: fixed; width: 48px; height: 48px; z-index: 200; pointer-events: none; }
    .bracket::before, .bracket::after { content: ''; position: absolute; background: #111111; }
    .bracket-tl { top: 28px; left: 28px; }
    .bracket-tl::before { width: 2px; height: 48px; top: 0; left: 0; }
    .bracket-tl::after  { width: 48px; height: 2px; top: 0; left: 0; }
    .bracket-tr { top: 28px; right: 28px; }
    .bracket-tr::before { width: 2px; height: 48px; top: 0; right: 0; }
    .bracket-tr::after  { width: 48px; height: 2px; top: 0; right: 0; }
    .bracket-bl { bottom: 28px; left: 28px; }
    .bracket-bl::before { width: 2px; height: 48px; bottom: 0; left: 0; }
    .bracket-bl::after  { width: 48px; height: 2px; bottom: 0; left: 0; }
    .bracket-br { bottom: 28px; right: 28px; }
    .bracket-br::before { width: 2px; height: 48px; bottom: 0; right: 0; }
    .bracket-br::after  { width: 48px; height: 2px; bottom: 0; right: 0; }

    #scene2 {
      position: fixed; top: 0; left: 0; width: 1080px; height: 1920px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding-top: 160px; padding-left: 64px; padding-right: 64px; box-sizing: border-box;
      z-index: 20; background: transparent; text-align: center; gap: 0;
    }
    .madeat2am-badge {
      display: inline-flex; align-items: center; gap: 8px;
      color: #111111; font-size: 22px; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 48px;
      opacity: 0;
    }
    .madeat2am-badge .sparkle { color: #FFC107; font-size: 26px; }
    .scene2-main {
      font-size: 96px; font-weight: 900; color: #111111; line-height: 1.0;
      margin-bottom: 16px; max-width: 900px;
      filter: blur(10px); opacity: 0;
    }
    .scene2-sub {
      font-size: 72px; font-weight: 800; color: #111111; line-height: 1.0; max-width: 900px;
      filter: blur(8px); opacity: 0;
    }
    .council-card {
      width: 520px; height: 520px; border: 3px solid #111111; border-radius: 28px;
      background: rgba(17,17,17,0.04);
      display: flex; align-items: center; justify-content: center; position: relative;
      margin-top: 60px;
      scale: 0.5; opacity: 0;
    }
    .council-center-node {
      width: 80px; height: 80px; border-radius: 50%; background: #111111;
      position: relative; z-index: 2;
    }
    .node-ring {
      position: absolute; width: 160px; height: 160px; border-radius: 50%;
      border: 2px solid rgba(17,17,17,0.2);
      top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    .satellite-node {
      position: absolute; width: 24px; height: 24px; border-radius: 50%;
      background: #111111;
      scale: 0; opacity: 0;
    }
    /* 5 satellite positions around the center node */
    .satellite-node:nth-child(3) { top: 20px;  left: 50%; transform: translateX(-50%); }
    .satellite-node:nth-child(4) { top: 50%; right: 20px;  transform: translateY(-50%); }
    .satellite-node:nth-child(5) { bottom: 20px; left: 50%; transform: translateX(-50%); }
    .satellite-node:nth-child(6) { top: 50%; left: 20px;   transform: translateY(-50%); }
    .satellite-node:nth-child(7) { top: 120px; right: 100px; }
  </style>
</head>
<body
  data-composition-id="main"
  data-width="1080"
  data-height="1920"
  data-start="0"
  data-duration="3"
>
  <div id="blueprint"></div>
  <div id="glow-mesh"></div>
  <div class="bracket bracket-tl"></div>
  <div class="bracket bracket-tr"></div>
  <div class="bracket bracket-bl"></div>
  <div class="bracket bracket-br"></div>

  <div id="scene2">
    <span class="madeat2am-badge">
      <span class="sparkle">✨</span> MADEAT2AM PROTOCOL <span class="sparkle">✨</span>
    </span>

    <span class="scene2-main">Instead of asking Claude,</span>
    <span class="scene2-sub">you ask <strong>THE COUNCIL.</strong></span>

    <div class="council-card" id="council-card">
      <div class="council-center-node"></div>
      <div class="node-ring"></div>
      <div class="satellite-node"></div>
      <div class="satellite-node"></div>
      <div class="satellite-node"></div>
      <div class="satellite-node"></div>
      <div class="satellite-node"></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines['main'] = gsap.timeline({ paused: false });
    const tl = window.__timelines['main'];
    tl.to('.madeat2am-badge', { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.1);
    tl.to('.scene2-main', { filter: 'blur(0px)', opacity: 1, y: 0, duration: 0.8, ease: 'expo.out' }, 0.2);
    tl.to('.scene2-sub',  { filter: 'blur(0px)', opacity: 1, y: 0, duration: 0.8, ease: 'expo.out' }, 0.45);
    tl.to('#council-card', { scale: 1, opacity: 1, duration: 0.7, ease: 'back.out(1.7)' }, 0.6);
    tl.to('#council-card .satellite-node', {
      scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(1.7)'
    }, 0.9, 0.12);
  </script>
</body>
</html>
