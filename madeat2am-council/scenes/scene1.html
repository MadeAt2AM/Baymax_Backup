<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: 'Inter'; font-weight: 900;
      src: url('https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.1/files/inter-latin-900-normal.woff2') format('woff2');
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FDFBF7; }
    body { font-family: 'Inter', 'Arial', sans-serif; color: #111111; }

    /* Blueprint grid */
    #blueprint {
      position: fixed; inset: 0; width: 1080px; height: 1920px; pointer-events: none; z-index: 1;
      background-image:
        linear-gradient(rgba(17,17,17,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(17,17,17,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    /* Glow mesh */
    #glow-mesh {
      position: fixed; inset: 0; width: 1080px; height: 1920px; pointer-events: none; z-index: 0; overflow: hidden;
    }
    #glow-mesh::before {
      content: ''; position: absolute; width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(255,193,7,0.18) 0%, transparent 70%);
      top: -100px; right: -150px;
      animation: driftA 8s ease-in-out infinite alternate;
    }
    #glow-mesh::after {
      content: ''; position: absolute; width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(211,47,47,0.12) 0%, transparent 70%);
      bottom: 200px; left: -100px;
      animation: driftB 10s ease-in-out infinite alternate;
    }
    @keyframes driftA { from: transform: translate(0,0); to: transform: translate(-60px, 40px); }
    @keyframes driftB { from: transform: translate(0,0); to: transform: translate(50px, -30px); }

    /* Corner brackets */
    .bracket { position: fixed; width: 48px; height: 48px; z-index: 200; pointer-events: none; }
    .bracket::before, .bracket::after { content: ''; position: absolute; background: #111111; }
    .bracket-tl { top: 28px; left: 28px; }
    .bracket-tl::before { width: 2px; height: 48px; top: 0; left: 0; }
    .bracket-tl::after  { width: 48px; height: 2px; top: 0; left: 0; }
    .bracket-tr { top: 28px; right: 28px; }
    .bracket-tr::before { width: 2px; height: 48px; top: 0; right: 0; }
    .bracket-tr::after  { width: 48px; height: 2px; top: 0; right: 0; }
    .bracket-bl { bottom: 28px; left: 28px; }
    .bracket-bl::before { width: 2px; height: 48px; bottom: 0; left: 0; }
    .bracket-bl::after  { width: 48px; height: 2px; bottom: 0; left: 0; }
    .bracket-br { bottom: 28px; right: 28px; }
    .bracket-br::before { width: 2px; height: 48px; bottom: 0; right: 0; }
    .bracket-br::after  { width: 48px; height: 2px; bottom: 0; right: 0; }

    /* Scene layout */
    #scene1 {
      position: fixed; top: 0; left: 0; width: 1080px; height: 1920px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 120px 64px; box-sizing: border-box; z-index: 10;
      background: transparent; text-align: center; gap: 0;
    }
    .scene1-line {
      font-size: 84px; font-weight: 900; line-height: 1.05; color: #111111;
      max-width: 900px; display: block; margin-bottom: 12px;
      filter: blur(12px); opacity: 0;
    }
    .scene1-yes-man {
      display: inline-block; background: #111111; color: #FFC107;
      font-size: 84px; font-weight: 900; padding: 0 18px; border-radius: 6px;
      line-height: 1.05; margin-bottom: 12px;
      scale: 0.4; opacity: 0;
    }
    .scene1-dots {
      color: #111111; font-size: 64px; font-weight: 300;
      letter-spacing: 4px; margin: 8px 0;
      opacity: 0;
    }
  </style>
</head>
<body
  data-composition-id="main"
  data-width="1080"
  data-height="1920"
  data-start="0"
  data-duration="3"
>
  <div id="blueprint"></div>
  <div id="glow-mesh"></div>
  <div class="bracket bracket-tl"></div>
  <div class="bracket bracket-tr"></div>
  <div class="bracket bracket-bl"></div>
  <div class="bracket bracket-br"></div>

  <div id="scene1">
    <span class="scene1-line">Everyone treats Claude like</span>
    <span class="scene1-yes-man" id="yesman">YES MAN</span>
    <span class="scene1-dots">...</span>
    <span class="scene1-line">But the top 10% do this instead.</span>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines['main'] = gsap.timeline({ paused: false });
    const tl = window.__timelines['main'];
    tl.to('#scene1 .scene1-line', {
      filter: 'blur(0px)', opacity: 1, y: 0, duration: 0.9, ease: 'power3.out'
    }, 0.1);
    tl.to('#yesman', {
      scale: 1, opacity: 1, duration: 0.6, ease: 'back.out(1.7)'
    }, 0.5);
    tl.to('.scene1-dots', {
      opacity: 1, duration: 0.4, ease: 'power2.out'
    }, 0.9);
    tl.to('#scene1 .scene1-line:last-child', {
      filter: 'blur(0px)', opacity: 1, y: 0, duration: 0.9, ease: 'power3.out'
    }, 1.1);
  </script>
</body>
</html>
